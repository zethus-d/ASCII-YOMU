name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install deps
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Native code and offline fonts
        run: |
          cp native/MainActivity.java android/app/src/main/java/com/niket/asciiyomu/MainActivity.java
          python3 native/patch_manifest.py
          mkdir -p www/fonts
          cp node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2 www/fonts/
          cp node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-700-normal.woff2 www/fonts/

      - name: Generate icon and splash
        run: npx capacitor-assets generate --android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ascii-yomu-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
